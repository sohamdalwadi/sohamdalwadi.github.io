about_content: | # this will include new lines to allow paragraphs
  I am a Senior Software Engineer with 11+ years of dedicated experience in the automotive software industry, specializing in Voice Recognition (Speech AI), in-vehicle infotainment, and emerging smart automotive domains.

  I believe great engineering comes from curiosity, humility, and steady craft. While my foundation is centered on systems engineering and automotive middleware with C and C++, I actively expand my horizons—exploring Qt desktop frameworks, native Android and Kotlin applications, and learning how next-generation Foresight systems can make vehicle intelligence more predictive and context-aware.

  Core areas of focus: <mark>Modern C++</mark>, <mark>Voice AI & Speech Middleware</mark>, <mark>Foresight Systems</mark>, and <mark>Android (Kotlin)</mark>.

